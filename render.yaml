# One-click deploy on Render: New → Blueprint → select this repo.
# Fill the "sync: false" values in the Render dashboard when asked.
services:
  - type: web
    name: agentgrid-poc
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentgrid-db
          property: connectionString
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Unlocks /platform (create businesses). Use a long random value; share it only with evaluators.
      - key: PLATFORM_ADMIN_KEY
        sync: false
      # Proxies in front of the app that append to X-Forwarded-For (for per-visitor rate limits).
      # Messages are limited per conversation, so a wrong value here only affects new-chat limits.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

databases:
  - name: agentgrid-db
    plan: free
