services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentgrid
      POSTGRES_PASSWORD: agentgrid
      POSTGRES_DB: agentgrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgrid"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://agentgrid:agentgrid@db:5432/agentgrid
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
